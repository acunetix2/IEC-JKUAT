  var t = localStorage.getItem('iec-theme');
  if (t === 'light' || (!t && !window.matchMedia('(prefers-color-scheme: dark)').matches))
    document.documentElement.classList.add('light');
})();
</script>

tailwind.config = {

</script>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: 'Inter', sans-serif; background: #07101a; color: #f0f0f0; overflow-x: hidden; }
  ::selection { background: #18C8FF; color: #000; }
  .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
  #nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; transition: background 0.3s; }
  #nav.scrolled { background: rgba(7,16,26,0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.05); }
  .gallery-img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.35s; }
  #proj-desc.desc-collapsed { display: -webkit-box; -webkit-line-clamp: 8; -webkit-box-orient: vertical; overflow: hidden; }
  .section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: #18C8FF; }
  html.light body { background: #eef0f4; color: #0d0f12; }
  html.light #nav.scrolled { background: rgba(238,240,244,0.92) !important; border-color: rgba(0,0,0,0.07) !important; }
  html.light .text-white { color: #0d0f12 !important; }
  html.light .text-white\/55, html.light .text-white\/45 { color: #4b5563 !important; }
  html.light [style*="color: rgba(255,255,255,0.55)"],
  html.light [style*="color:rgba(255,255,255,0.55)"] { color: #374151 !important; }
  html.light [style*="color: rgba(255,255,255,0.45)"],
  html.light [style*="color:rgba(255,255,255,0.45)"] { color: #4b5563 !important; }
  html.light [style*="color: rgba(255,255,255,0.5)"],
  html.light [style*="color:rgba(255,255,255,0.5)"] { color: #6b7280 !important; }
  html.light [style*="color: rgba(255,255,255,0.35)"],
  html.light [style*="color:rgba(255,255,255,0.35)"] { color: #9ca3af !important; }
  html.light [style*="color: rgba(255,255,255,0.30)"],
  html.light [style*="color:rgba(255,255,255,0.30)"] { color: #9ca3af !important; }
  html.light [style*="color: rgba(255,255,255,0.8)"],
  html.light [style*="color:rgba(255,255,255,0.8)"] { color: #1f2937 !important; }
  html.light [style*="color: rgba(255,255,255,0.7)"],
  html.light [style*="color:rgba(255,255,255,0.7)"] { color: #374151 !important; }
  html.light [style*="color: rgba(255,255,255,0.6)"],
  html.light [style*="color:rgba(255,255,255,0.6)"] { color: #4b5563 !important; }
  html.light [style*="background: rgba(255,255,255,0.03)"],
  html.light [style*="background:rgba(255,255,255,0.03)"] { background: #ffffff !important; border-color: rgba(0,0,0,0.09) !important; }
  html.light [style*="background: rgba(255,255,255,0.04)"],
  html.light [style*="background:rgba(255,255,255,0.04)"] { background: rgba(0,0,0,0.03) !important; }
  html.light [style*="border: 1px solid rgba(255,255,255,0.12)"],
  html.light [style*="border:1px solid rgba(255,255,255,0.12)"] { border-color: rgba(0,0,0,0.12) !important; }
  html.light [style*="border: 1px solid rgba(255,255,255,0.07)"],
  html.light [style*="border:1px solid rgba(255,255,255,0.07)"] { border-color: rgba(0,0,0,0.09) !important; }
  html.light [style*="background: rgba(255,255,255,0.08)"],
  html.light [style*="background:rgba(255,255,255,0.08)"] { background: rgba(0,0,0,0.06) !important; }
  html.light .section-label { color: #0aaad4 !important; }
  html.light h1, html.light h2, html.light h3 { color: #0d0f12 !important; }
</style>

<body>

<!-- NAV -->
<nav id="nav">
  <div class="flex justify-between items-center px-6 md:px-16 py-5 max-w-screen-xl mx-auto">
    <a href="index.html" class="font-display font-bold text-white text-lg tracking-tight">IEC <span class="text-iec-blue">JKUAT</span></a>
    <div class="hidden md:flex items-center gap-10">
      <a class="text-sm font-medium text-white/60 hover:text-white transition-colors" href="index.html">Home</a>

      <a href="index.html#join" class="hidden sm:flex items-center gap-2 px-5 py-2 rounded text-sm font-bold hover:opacity-80 transition-opacity" style="background:#18C8FF;color:#000;">Join IEC</a>
      <button onclick="toggleDarkMode()" class="flex p-2 text-white/50 hover:text-white transition-colors" title="Toggle theme" aria-label="Toggle dark/light mode">
        <span data-theme-icon-light class="material-symbols-outlined" style="display:none;">light_mode</span>
        <span data-theme-icon-dark class="material-symbols-outlined">dark_mode</span>
      </button>
      <button class="md:hidden p-2 text-white/60 hover:text-white" onclick="toggleMobileMenu()">
        <span class="material-symbols-outlined">menu</span>

</nav>

<!-- BACK LINK -->
<div class="px-6 md:px-16 max-w-screen-xl mx-auto" style="padding-top: 88px;">
  <a href="showcase.html" class="inline-flex items-center gap-1.5 text-sm font-medium hover:opacity-70 transition-opacity" style="color:rgba(255,255,255,0.45);">
    <span class="material-symbols-outlined text-[16px]">arrow_back</span> All Projects
  </a>
</div>

<!-- CONTENT -->
<main id="project-page-content" class="px-6 md:px-16 max-w-screen-xl mx-auto py-8">
  <div class="flex items-center justify-center py-24" style="color:rgba(255,255,255,0.3);">
    <span class="material-symbols-outlined animate-spin mr-3">sync</span> Loading project…
  </div>
</main>

<!-- FOOTER -->
<footer style="background:#060606;">
  <div class="px-6 md:px-16 py-6 max-w-screen-xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3 border-t border-white/6">
    <a href="index.html" class="font-display font-bold text-white text-sm">IEC <span class="text-iec-blue">JKUAT</span></a>
    <p class="text-[11px] text-white/15">&copy; 2026 IEC JKUAT</p>
  </div>
</footer>

<script src="js/embeds.js"></script>
<script src="js/main.js"></script>
<script>
const nav = document.getElementById('nav');
window.addEventListener('scroll', () => nav.classList.toggle('scrolled', window.scrollY > 40), { passive: true });

let _galIdx = 0;
function galLoad(i) {
  const img = document.getElementById('gal-img-' + i);
  if (img && img.dataset.src) { img.src = img.dataset.src; img.removeAttribute('data-src'); }
}
function galGoto(i) {
  const all = document.querySelectorAll('[id^="gal-img-"]');
  const t = all.length;
  if (!t) return;
  i = ((i % t) + t) % t;
  galLoad(i);
  galLoad((i + 1) % t);
  all.forEach((img,idx) => img.style.opacity = idx===i?1:0);
  document.querySelectorAll('[id^="gal-dot-"]').forEach((d,idx) => { d.style.background=idx===i?'#fff':'rgba(255,255,255,0.35)'; });
  document.querySelectorAll('[id^="gal-thumb-"]').forEach((t2,idx) => { t2.style.opacity=idx===i?1:0.4; t2.style.borderColor=idx===i?'#18C8FF':'transparent'; });
  const counter = document.getElementById('gal-counter');
  if (counter) counter.textContent = (i + 1) + ' / ' + t;
  _galIdx = i;
}
function toggleDesc() {
  const d = document.getElementById('proj-desc');
  const b = document.getElementById('desc-toggle');
  if (!d || !b) return;
  const open = d.classList.toggle('desc-open');
  d.classList.toggle('desc-collapsed', !open);
  b.innerHTML = open
    ? 'Show less <span class="material-symbols-outlined text-[16px]">expand_less</span>'
    : 'Read more <span class="material-symbols-outlined text-[16px]">expand_more</span>';
}
function galNext(total) { galGoto((_galIdx+1)%total); }
function galPrev() { const t=document.querySelectorAll('[id^="gal-img-"]').length; galGoto((_galIdx-1+t)%t); }

const PROJECT_FALLBACK_IMG = 'https://images.unsplash.com/photo-1625246333195-78d9c38ad449?w=800&h=600&fit=crop';
function isImg(u) {
  if (!u) return false;
  const clean = String(u).split('?')[0].split('#')[0];
  return /\.(jpg|jpeg|png|gif|webp|svg)$/i.test(clean);
}
function isVid(u) { return u && /\.(mp4|webm|mov|avi)$/i.test(u); }
function parseEmbed(raw) {
  if (!raw) return [];
  if (Array.isArray(raw)) return raw.filter(Boolean);
  try { const p=JSON.parse(raw); return Array.isArray(p)?p.filter(Boolean):[]; } catch { return raw.trim()?[raw.trim()]:[];}
}
function ytEmbed(url) {
  const m=url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m?`https://www.youtube.com/embed/${m[1]}?rel=0&modestbranding=1`:null;
}

async function loadProject() {
  const id = new URLSearchParams(location.search).get('id');
  if (!id) { document.getElementById('project-page-content').innerHTML='<p class="text-center py-16 text-white/30">No project ID provided.</p>'; return; }

  try {
    const sb = initSupabase();
    const { data: p, error } = await sb.from('projects').select('*').eq('id', id).single();
    if (error || !p) throw new Error('Project not found');

    document.title = `${p.name} | IEC JKUAT`;
    const safeName = escapeHtml(p.name);
    const safeDesc = escapeHtml(p.description || '');
    const safeLead = escapeHtml(p.team_lead);
    const safeCat = escapeHtml(p.category || 'Project');
    const safeStatus = escapeHtml(p.status);

    let media = [];
    try {
      if (Array.isArray(p.media_urls)) {
        media = p.media_urls;
      } else if (typeof p.media_urls === 'string') {
        media = JSON.parse(p.media_urls || '[]');
      }
    } catch(e) { media = []; }
    // Same first-image pick as showcase.js; fall back to the shared
    // thumbnail so list and detail never disagree.
    let images = media.filter(isImg);
    if (images.length === 0) images = [PROJECT_FALLBACK_IMG];
    const videos = media.filter(isVid);
    const embeds = parseEmbed(p.embed_urls);

    const statusStyle = {
      'Incubating': { color:'#18C8FF', bg:'rgba(24,200,255,0.12)', bar:'#18C8FF' },
      'MVP Live':   { color:'#22c55e', bg:'rgba(34,197,94,0.12)',  bar:'#22c55e' },
      'Ideation':   { color:'#FBB03B', bg:'rgba(251,176,59,0.12)', bar:'#FBB03B' },
    };
    const ss = statusStyle[p.status] || statusStyle['Ideation'];

    // Gallery — images always has ≥1 entry (shared fallback), so the
    // detail hero matches the showcase thumbnail exactly.
    const galleryHTML = `
      <div class="relative overflow-hidden rounded-xl mb-8" style="height:clamp(260px,40vw,480px);background:#000;">
        ${images.map((img,i) => i === 0
          ? `<img src="${img}" alt="${safeName}" class="gallery-img" style="opacity:1;" id="gal-img-${i}" fetchpriority="high"/>`
          : `<img data-src="${img}" alt="${safeName}" loading="lazy" class="gallery-img" style="opacity:0;" id="gal-img-${i}"/>`).join('')}
        <div class="absolute inset-0" style="background:linear-gradient(to top,rgba(7,16,26,0.6) 0%,transparent 50%);pointer-events:none;"></div>
        ${images.length>1?`
        <button onclick="galPrev()" aria-label="Previous image" class="absolute left-3 md:left-4 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full flex items-center justify-center hover:opacity-80" style="background:rgba(0,0,0,0.55);">
          <span class="material-symbols-outlined text-white text-[20px]">chevron_left</span>
        </button>
        <button onclick="galNext(${images.length})" aria-label="Next image" class="absolute right-3 md:right-4 top-1/2 -translate-y-1/2 w-11 h-11 rounded-full flex items-center justify-center hover:opacity-80" style="background:rgba(0,0,0,0.55);">
          <span class="material-symbols-outlined text-white text-[20px]">chevron_right</span>
        </button>
        <div id="gal-counter" class="absolute top-4 right-4 text-xs font-semibold text-white px-2.5 py-1 rounded-full" style="background:rgba(0,0,0,0.55);">1 / ${images.length}</div>
        ${images.length<=8?`
        <div class="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2">
          ${images.map((_,i)=>`<button onclick="galGoto(${i})" aria-label="Go to image ${i + 1}" id="gal-dot-${i}" class="w-2 h-2 rounded-full transition-all" style="background:${i===0?'#fff':'rgba(255,255,255,0.35)'}"></button>`).join('')}
        </div>`:''}`:''}
      </div>
      ${images.length>1?`
      <div class="flex gap-2 overflow-x-auto pb-2 mb-8" style="scrollbar-width:none;">
        ${images.map((img,i)=>`<img src="${img}" onclick="galGoto(${i})" id="gal-thumb-${i}" loading="lazy" class="flex-shrink-0 rounded cursor-pointer transition-all" style="width:84px;height:60px;object-fit:cover;opacity:${i===0?1:0.4};border:2px solid ${i===0?'#18C8FF':'transparent'};"/>`).join('')}
      </div>`:''}`;

    const videosHTML = videos.length ? `
      <div class="mb-8">
        <h2 class="font-display font-bold text-white text-xl mb-4">Videos <span class="text-white/30 text-base font-normal">${videos.length}</span></h2>
        <div class="grid gap-4" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr));">
          ${videos.map(v=>`<div class="aspect-video rounded-xl overflow-hidden" style="background:#000;"><video class="w-full h-full" controls preload="none" src="${v}"></video></div>`).join('')}
        </div>
      </div>` : '';

    const embedsHTML = embeds.length ? `
      <div class="mb-8">
        <h2 class="font-display font-bold text-white text-xl mb-4">Media</h2>
        <div class="space-y-4">
          ${embeds.map(url=>{
            const yt=ytEmbed(url);
            if(yt) return `<div class="aspect-video rounded-xl overflow-hidden" style="background:#000;"><iframe src="${yt}" class="w-full h-full" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen frameborder="0"></iframe></div>`;
            return `<a href="${url}" target="_blank" rel="noopener" class="flex items-center gap-3 p-4 rounded-xl hover:opacity-80 transition-opacity" style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);"><span class="material-symbols-outlined text-[18px]" style="color:#18C8FF;">open_in_new</span><span class="text-sm text-white/60 truncate">${escapeHtml(url)}</span></a>`;
          }).join('')}
        </div>
      </div>` : '';

    document.getElementById('project-page-content').innerHTML = `
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Left: main content -->
        <div class="lg:col-span-2">
          ${galleryHTML}
          <p class="section-label mb-3">${safeCat}</p>
          <h1 class="font-display font-extrabold text-white mb-4 leading-tight" style="font-size:clamp(1.8rem,4vw,3rem);">${safeName}</h1>
          <div class="mb-8">
            <p id="proj-desc" class="text-sm leading-relaxed whitespace-pre-line ${((p.description || '').length > 400) ? 'desc-collapsed' : ''}" style="color:rgba(255,255,255,0.55);">${safeDesc}</p>
            ${((p.description || '').length > 400) ? `<button id="desc-toggle" onclick="toggleDesc()" class="inline-flex items-center gap-1 text-sm font-semibold mt-3 hover:opacity-80 transition-opacity" style="color:#18C8FF;">Read more <span class="material-symbols-outlined text-[16px]">expand_more</span></button>` : ''}
          </div>
          ${videosHTML}
          ${embedsHTML}
        </div>

        <!-- Right: sidebar -->
        <div class="lg:col-span-1">
          <div class="sticky top-24 space-y-4">
            <div class="rounded-xl p-6" style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.07);">
              <h3 class="font-display font-bold text-white text-base mb-5">Project Info</h3>
              <div class="space-y-4">
                <div>
                  <p class="text-xs text-white/30 uppercase tracking-wider mb-1">Status</p>
                  <span class="text-[11px] font-bold px-3 py-1.5 rounded-full" style="background:${ss.bg};color:${ss.color};">${safeStatus}</span>
                </div>
                <div>
                  <p class="text-xs text-white/30 uppercase tracking-wider mb-1">Team Lead</p>
                  <p class="text-sm text-white/80 font-medium">${safeLead}</p>
                </div>
                ${p.category ? `<div>
                  <p class="text-xs text-white/30 uppercase tracking-wider mb-1">Category</p>
                  <p class="text-sm text-white/70">${safeCat}</p>
                </div>` : ''}
                ${p.progress > 0 ? `
                <div>
                  <div class="flex justify-between text-xs mb-2" style="color:rgba(255,255,255,0.35);">
                    <span>Progress</span><span>${p.progress}%</span>
                  </div>
                  <div class="h-2 rounded-full overflow-hidden" style="background:rgba(255,255,255,0.08);">
                    <div class="h-full rounded-full" style="width:${p.progress}%;background:${ss.bar};"></div>
                  </div>
                </div>` : ''}
              </div>
            </div>
            <a href="showcase.html" class="flex items-center justify-center gap-2 w-full py-3 rounded-xl text-sm font-semibold hover:opacity-80 transition-opacity" style="border:1px solid rgba(255,255,255,0.12);color:rgba(255,255,255,0.55);">
              <span class="material-symbols-outlined text-[16px]">arrow_back</span> Back to Projects
            </a>
          </div>
        </div>

      </div>`;

  } catch(err) {
    document.getElementById('project-page-content').innerHTML = `
      <div class="text-center py-16">
        <span class="material-symbols-outlined text-5xl mb-4 block text-red-400">error</span>
        <p class="text-white/50 text-sm">${err.message}</p>
        <a href="showcase.html" class="inline-block mt-6 text-sm text-iec-blue hover:underline">← Back to Projects</a>
      </div>`;
  }
}

document.addEventListener('DOMContentLoaded', loadProject);
</script>
</body>
